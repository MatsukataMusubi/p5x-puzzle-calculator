<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  body { background:#F4F3EE; font-family: sans-serif; padding: 20px; }
  .grid5 { display:grid; grid-template-columns: repeat(5, 56px); grid-template-rows: repeat(5, 56px); gap: 4px; width: max-content; }
  .gcell { border:2px solid #E4E3DD; border-radius: 8px; background: #fff; display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; }
  .glock { background: #9aa0ab; color: #fff; }
  .gt { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #1A1B1C; }
  .row { margin-bottom: 24px; }
</style></head>
<body>
<div class="row"><div class="gt">9/27 代码修正后（锁定格=上下翻转）</div><div id="b1"></div></div>
<div class="row"><div class="gt">9/27 修正前（原始数据）</div><div id="b2"></div></div>
<script src="data.js"></script>
<script>
  function render(el, locked, label) {
    var cells = '';
    for (var y = 0; y < 5; y++) for (var x = 0; x < 5; x++) {
      var k = x + ',' + y;
      var hit = false;
      locked.forEach(function (p) { if (p[0] === x && p[1] === y) hit = true; });
      cells += hit ? '<div class="gcell glock">\u2715</div>' : '<div class="gcell"></div>';
    }
    el.innerHTML = '<div class="gt">' + label + '</div><div class="grid5">' + cells + '</div>';
  }
  var lv4 = LEVELS.filter(function (l) { return l.sn === 4; })[0];
  var lv4old = { locked: [[0,4],[1,4],[3,0],[4,0]] };
  render(document.getElementById('b1'), lv4.locked, '修正后 locked=' + JSON.stringify(lv4.locked));
  render(document.getElementById('b2'), lv4old.locked, '修正前 locked=[[0,4],[1,4],[3,0],[4,0]]');
</script>
</body>
</html>
